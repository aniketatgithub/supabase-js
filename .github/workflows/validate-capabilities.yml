name: SDK Compliance

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: supabase/sdk/.github/workflows/validate-sdk-compliance-javascript.yml@c5e199597c2ea682313854e7083cad05cfa203c1 # capability-matrix/v2.3.0
    with:
      build-command: |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm nx run-many --target=docs:json --output-style=stream
      spec-glob: packages/core/*/docs/v2/spec.json
